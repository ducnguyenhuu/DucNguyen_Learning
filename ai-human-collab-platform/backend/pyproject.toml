[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hacp"
version = "0.1.0"
description = "Human-AI Collaboration Platform — local-first workflow orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "litellm>=1.40.0",
    "pydantic>=2.7.0",
    "watchdog>=4.0.0",
    "keyring>=25.0.0",
    "sse-starlette>=2.1.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
hacp = "hacp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hacp"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "D",    # pydocstyle
    "S",    # bandit security
    "ANN",  # flake8-annotations (type coverage)
]
ignore = [
    "D100", # missing docstring in public module (ok for __init__.py)
    "D104", # missing docstring in public package
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line summary second line (conflicts with D212)
    "ANN101", # self annotation not needed
    "ANN102", # cls annotation not needed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN"]  # allow assert, skip docstrings in tests
"bin/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["litellm.*", "keyring.*", "watchdog.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -q"
markers = [
    "unit: fast unit tests (no I/O)",
    "integration: tests that touch the filesystem or mock external services",
    "perf: performance benchmark tests",
]

[tool.coverage.run]
source = ["src/hacp"]
omit = ["tests/*", "bin/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
