# -- Tenancy API
api:
  image:
    repository: "" # Required: ACR login server + image name
    tag: "latest"
  replicas: 2 # FR-014: >=2 required for zero-downtime rollback (US4)
  rollout:
    maxUnavailable: 0 # FR-014: old replicas keep serving until new ones are Ready
    maxSurge: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  serviceAccount:
    name: "tenancy-api"
    annotations: {} # Overridden in values-dev.yaml with workload identity client ID
  probes:
    liveness:
      path: /health/live
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /health/ready
      port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5
  env: [] # Additional environment variables

# -- OTel Collector
otelCollector:
  enabled: true
  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.111.0" # Pin to known-good version
  replicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  serviceAccount:
    name: "otel-collector"
    annotations: {}
  ports:
    grpc: 4317
    http: 4318
  sampleRate: 10

# -- Key Vault CSI
keyVault:
  enabled: true
  vaultName: "" # Required: Key Vault name
  tenantId: "" # Required: Azure AD tenant ID
  secrets:
    - name: new-relic-licence-key
      alias: NEW_RELIC_LICENCE_KEY

# -- Ingress
ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  host: "" # Optional: if empty, matches all hosts
