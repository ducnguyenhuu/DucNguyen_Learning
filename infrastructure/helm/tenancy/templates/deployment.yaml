# FR-014 (clarified 2026-09-26): replicas: 2 with maxUnavailable: 0 is deliberate, not
# an arbitrary default — with 1 replica, Kubernetes' default rollout strategy tears
# down the old pod before the new one is Ready, causing a real outage during US4's
# broken-rollout scenario regardless of the new image's health. See
# contracts/helm-values.md's Notes section (specs/005-terraform-azure).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenancy-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.api.rollout.maxUnavailable }}
      maxSurge: {{ .Values.api.rollout.maxSurge }}
  selector:
    matchLabels:
      {{- include "tenancy.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenancy.api.selectorLabels" . | nindent 8 }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      # research.md R8: spreads the 2 replicas across nodes so a single node
      # failure doesn't take down both at once.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "tenancy.api.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: tenancy-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.api.probes.liveness.port }}
          {{- if .Values.api.env }}
          env:
            {{- toYaml .Values.api.env | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: {{ .Values.api.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: {{ .Values.api.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
