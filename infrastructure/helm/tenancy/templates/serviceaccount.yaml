apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    {{- toYaml .Values.api.serviceAccount.annotations | nindent 4 }}
---
{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.otelCollector.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    {{- toYaml .Values.otelCollector.serviceAccount.annotations | nindent 4 }}
{{- end }}
