apiVersion: v1
kind: Service
metadata:
  name: tenancy-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tenancy.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.api.probes.liveness.port }}
