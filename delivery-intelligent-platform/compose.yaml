services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server images are amd64-only (research.md R2); naming this explicitly turns a
    # confusing emulation warning on Apple Silicon into a documented choice.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required — copy .env.example to .env and set it}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Versioned tools path and -C (trust the container's self-signed certificate) are both
      # required by current images — research.md R2.
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  otel-collector:
    extends:
      file: deploy/otel-collector/docker-compose.yml
      service: otel-collector

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    # Must exceed the 15s drain (HostOptions.ShutdownTimeout) plus the ~15s OpenTelemetry
    # flush tail if the Collector is unreachable — research.md R4. Compose's 10s default
    # would be too short.
    stop_grace_period: 45s
    environment:
      ConnectionStrings__IdentityDb: Server=sqlserver;Database=IdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required — copy .env.example to .env and set it};Encrypt=True;TrustServerCertificate=True
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${AZURE_AD_TENANT_ID:?AZURE_AD_TENANT_ID is required for authenticated scenarios — copy .env.example to .env and set it}
      AzureAd__ClientId: ${AZURE_AD_CLIENT_ID:?AZURE_AD_CLIENT_ID is required for authenticated scenarios — copy .env.example to .env and set it}
      AzureAd__Audience: ${AZURE_AD_AUDIENCE:?AZURE_AD_AUDIENCE is required for authenticated scenarios — copy .env.example to .env and set it}
      Observability__OtlpEndpoint: http://otel-collector:4317
      ASPNETCORE_ENVIRONMENT: Development
      Https__RedirectionEnabled: "false"
      # No new configuration key: this composed stack sets no new key beyond what
      # src/Identity/Identity.Api already reads via IConfiguration (research.md R3, R5).

volumes:
  sqlserver-data:
